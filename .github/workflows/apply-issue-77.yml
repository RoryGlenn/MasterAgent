              '''# Enforce advisory sub-agent safety boundaries

          ## Problem

          The checked-in child profiles described narrow behavior, but prompt text and
          frontmatter substring checks did not enforce the effective dispatch boundary.

          ## Desired outcome

          Advisory research and review remain useful while children are technically
          unable to execute, mutate, authorize, select final targets, or delegate.

          ## Scope

          Add a deterministic profile loader, per-goal dispatcher, tool gate, sensitive
          context filter, fallback path, evidence revalidation, adversarial tests, and
          aligned documentation.

          ## Rationale

          Security must not depend on a model following written instructions.

          ## Alternatives considered

          Keeping `execute` with prompt restrictions was rejected because the effective
          tool grant would remain broader than the stated contract. A live-host-only
          canary was rejected as the primary control because it is nondeterministic.

          ## Non-goals

          This change does not grant provider authority, construct plans, create
          approvals, or make live Copilot availability a CI prerequisite.

          ## Risks

          The host may expose future tools or invocation paths. Exact profile validation
          and fail-closed dispatch make such widening visible in CI.
          ''',
