name: Apply issue 77 implementation

on:
  push:
    branches:
      - agent/issue-77-advisory-boundary

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Prepare issue 77 implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/issue-77-advisory-boundary
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply deterministic advisory boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          root = Path.cwd()

          advisory_source = r'''"""Deterministic safety boundary for repository advisory sub-agents."""

          from __future__ import annotations

          import hashlib
          import re
          from collections.abc import Callable, Iterator, Mapping, Sequence
          from dataclasses import dataclass
          from enum import StrEnum
          from pathlib import Path, PurePosixPath
          from typing import TypeAlias

          EvidenceValue: TypeAlias = str | bytes
          ToolHandler: TypeAlias = Callable[[Mapping[str, object]], object]
          ClaimValidator: TypeAlias = Callable[[str, tuple[EvidenceValue, ...]], bool]

          _PARENT_PROFILE = "MasterAgent"
          _MAX_PROFILE_BYTES = 64 * 1024
          _MAX_TEXT_CHARACTERS = 32 * 1024
          _MAX_PATHS = 64
          _MAX_EVIDENCE_REFS = 128
          _MAX_TYPED_READS = 16
          _SHA256 = re.compile(r"[0-9a-f]{64}\\Z")
          _CAPABILITY = re.compile(r"[a-z][a-z0-9_.-]{0,127}\\Z")
          _FORBIDDEN_CONTEXT_KEY = re.compile(
              r"(?:credential|secret|token|password|approval|signature|private[_-]?key|"
              r"recipient|destination|final[_-]?target)",
              re.IGNORECASE,
          )
          _FORBIDDEN_BODY_GRANT = re.compile(
              r"\\b(?:may|can|is allowed to)\\s+(?:directly\\s+)?"
              r"(?:execute|edit|invoke another agent|contact providers|approve|send|"
              r"publish|merge|delete|administer)",
              re.IGNORECASE,
          )
          _PRIVATE_MARKERS = (
              "-----BEGIN PRIVATE KEY-----",
              "-----BEGIN OPENSSH PRIVATE KEY-----",
              "-----BEGIN PGP PRIVATE KEY BLOCK-----",
          )


          class AdvisoryBoundaryError(ValueError):
              """Raised when advisory work crosses the deterministic boundary."""


          class AdvisoryUnavailable(RuntimeError):
              """Raised when the optional host delegation surface is unavailable."""


          class AdvisoryRole(StrEnum):
              """Reviewed depth-one advisory roles."""

              RESEARCHER = "researcher"
              PLAN_REVIEWER = "plan_reviewer"


          _PROFILE_PATHS = {
              AdvisoryRole.RESEARCHER: Path(
                  ".github/agents/MasterAgent-Read-Researcher.agent.md"
              ),
              AdvisoryRole.PLAN_REVIEWER: Path(
                  ".github/agents/MasterAgent-Plan-Reviewer.agent.md"
              ),
          }
          _EXPECTED_NAMES = {
              AdvisoryRole.RESEARCHER: "MasterAgent Read Researcher",
              AdvisoryRole.PLAN_REVIEWER: "MasterAgent Plan Reviewer",
          }
          _EXPECTED_TOOLS = {
              AdvisoryRole.RESEARCHER: ("read", "search"),
              AdvisoryRole.PLAN_REVIEWER: ("read", "search"),
          }


          @dataclass(frozen=True, slots=True)
          class AdvisoryProfile:
              """Validated checked-in advisory profile."""

              role: AdvisoryRole
              name: str
              tools: tuple[str, ...]
              user_invocable: bool
              model_invocable: bool
              body: str
              path: Path


          @dataclass(frozen=True, slots=True)
          class AdvisoryContext:
              """Minimum context that may cross into an advisory child."""

              question: str
              repository_paths: tuple[str, ...] = ()
              evidence_refs: tuple[str, ...] = ()
              typed_read_capabilities: tuple[str, ...] = ()


          @dataclass(frozen=True, slots=True)
          class AdvisoryInvocation:
              """One parent-authorized depth-one advisory invocation."""

              goal_id: str
              task_id: str
              role: AdvisoryRole
              profile_name: str
              depth: int
              context: AdvisoryContext


          @dataclass(frozen=True, slots=True)
          class AdvisoryToolRequest:
              """One requested child tool dispatch."""

              name: str
              arguments: Mapping[str, object]


          @dataclass(frozen=True, slots=True)
          class EvidenceCitation:
              """Content-bound evidence reference returned by a child."""

              reference: str
              sha256: str


          @dataclass(frozen=True, slots=True)
          class AdvisoryClaim:
              """One advisory claim and its cited evidence."""

              text: str
              citations: tuple[EvidenceCitation, ...]


          @dataclass(frozen=True, slots=True)
          class AdvisoryReport:
              """Untrusted child report."""

              task_id: str
              role: AdvisoryRole
              summary: str
              claims: tuple[AdvisoryClaim, ...]


          @dataclass(frozen=True, slots=True)
          class ValidatedAdvisoryReport:
              """Parent-rechecked report that still carries no authority."""

              report: AdvisoryReport
              evidence_digest: str

              @property
              def authoritative(self) -> bool:
                  """Return ``False`` because advisory output never grants authority."""

                  return False


          def load_advisory_profiles(root: Path) -> dict[AdvisoryRole, AdvisoryProfile]:
              """Load and validate the exact checked-in advisory profiles.

              Parameters
              ----------
              root
                  Repository root containing ``.github/agents``.

              Returns
              -------
              dict
                  Profiles keyed by their reviewed role.

              Raises
              ------
              AdvisoryBoundaryError
                  If a profile is missing, widened, user-invocable, malformed, or unsafe.
              """

              repository_root = root.resolve()
              profiles: dict[AdvisoryRole, AdvisoryProfile] = {}
              for role, relative in _PROFILE_PATHS.items():
                  path = _validated_profile_path(repository_root, relative)
                  raw = path.read_bytes()
                  if len(raw) > _MAX_PROFILE_BYTES:
                      raise AdvisoryBoundaryError(f"advisory profile is too large: {relative}")
                  try:
                      text = raw.decode("utf-8")
                  except UnicodeDecodeError as error:
                      raise AdvisoryBoundaryError(
                          f"advisory profile is not UTF-8: {relative}"
                      ) from error
                  metadata, body = _parse_frontmatter(text, relative)
                  name = metadata.get("name")
                  tools_value = metadata.get("tools")
                  user_invocable = metadata.get("user-invocable")
                  disable_model_invocation = metadata.get("disable-model-invocation")
                  if not isinstance(name, str):
                      raise AdvisoryBoundaryError(f"profile name is invalid: {relative}")
                  if not isinstance(tools_value, tuple):
                      raise AdvisoryBoundaryError(f"profile tools are invalid: {relative}")
                  tools = tuple(str(item) for item in tools_value)
                  if name != _EXPECTED_NAMES[role]:
                      raise AdvisoryBoundaryError(
                          f"unexpected advisory profile name for {role.value}: {name!r}"
                      )
                  if tools != _EXPECTED_TOOLS[role]:
                      raise AdvisoryBoundaryError(
                          f"unsafe tools for {name}: expected {_EXPECTED_TOOLS[role]}, "
                          f"found {tools}"
                      )
                  if user_invocable is not False:
                      raise AdvisoryBoundaryError(
                          f"advisory profile must not be user-invocable: {name}"
                      )
                  if disable_model_invocation is not False:
                      raise AdvisoryBoundaryError(
                          f"advisory profile must remain parent-invocable: {name}"
                      )
                  if _FORBIDDEN_BODY_GRANT.search(body):
                      raise AdvisoryBoundaryError(
                          f"advisory profile grants a forbidden permission: {name}"
                      )
                  profiles[role] = AdvisoryProfile(
                      role=role,
                      name=name,
                      tools=tools,
                      user_invocable=False,
                      model_invocable=True,
                      body=body,
                      path=relative,
                  )
              return profiles


          def digest_evidence(value: EvidenceValue) -> str:
              """Return the SHA-256 digest for one exact evidence value."""

              raw = value.encode("utf-8") if isinstance(value, str) else value
              return hashlib.sha256(raw).hexdigest()


          class AdvisoryBoundary:
              """Enforce parent-only depth-one delegation and report revalidation."""

              def __init__(
                  self,
                  profiles: Mapping[AdvisoryRole, AdvisoryProfile],
                  *,
                  goal_id: str,
                  sensitive_values: Sequence[str] = (),
              ) -> None:
                  """Create one per-goal advisory boundary.

                  Parameters
                  ----------
                  profiles
                      Exact profiles returned by :func:`load_advisory_profiles`.
                  goal_id
                      Stable identifier for one operator goal.
                  sensitive_values
                      Exact secret, credential, approval, or private-context values that
                      must never appear in child input, tool arguments, or output.
                  """

                  expected = set(AdvisoryRole)
                  if set(profiles) != expected:
                      raise AdvisoryBoundaryError("the exact advisory profile set is required")
                  self._profiles = dict(profiles)
                  self._goal_id = _bounded_text(goal_id, "goal_id", maximum=256)
                  self._sensitive_values = tuple(value for value in sensitive_values if value)
                  self._research_count = 0
                  self._review_count = 0
                  self._task_ids: set[str] = set()

              def prepare(
                  self,
                  role: AdvisoryRole,
                  *,
                  task_id: str,
                  context: AdvisoryContext,
                  caller_profile: str = _PARENT_PROFILE,
                  depth: int = 1,
              ) -> AdvisoryInvocation:
                  """Authorize one bounded advisory invocation before host dispatch."""

                  if caller_profile != _PARENT_PROFILE:
                      raise AdvisoryBoundaryError(
                          "only the selected MasterAgent parent may invoke an advisory child"
                      )
                  if depth != 1:
                      raise AdvisoryBoundaryError("advisory delegation depth must equal one")
                  normalized_task = _bounded_text(task_id, "task_id", maximum=256)
                  if normalized_task in self._task_ids:
                      raise AdvisoryBoundaryError(
                          f"advisory task ID is already used: {normalized_task}"
                      )
                  self._validate_context(context)
                  if role is AdvisoryRole.RESEARCHER:
                      if self._research_count >= 3:
                          raise AdvisoryBoundaryError(
                              "one operator goal permits at most three research tasks"
                          )
                      self._research_count += 1
                  else:
                      if self._review_count >= 1:
                          raise AdvisoryBoundaryError(
                              "one operator goal permits at most one plan review"
                          )
                      self._review_count += 1
                  self._task_ids.add(normalized_task)
                  return AdvisoryInvocation(
                      goal_id=self._goal_id,
                      task_id=normalized_task,
                      role=role,
                      profile_name=self._profiles[role].name,
                      depth=1,
                      context=context,
                  )

              def dispatch_tool(
                  self,
                  invocation: AdvisoryInvocation,
                  request: AdvisoryToolRequest,
                  handlers: Mapping[str, ToolHandler],
              ) -> object:
                  """Authorize a child tool request before invoking its handler."""

                  self._validate_invocation(invocation)
                  self._reject_sensitive(request.arguments, "tool arguments")
                  if request.name in {"read", "search"}:
                      pass
                  elif request.name == "typed_read":
                      if invocation.role is not AdvisoryRole.RESEARCHER:
                          raise AdvisoryBoundaryError(
                              "the plan reviewer cannot request provider reads"
                          )
                      capability = request.arguments.get("capability")
                      if not isinstance(capability, str):
                          raise AdvisoryBoundaryError(
                              "typed_read requires one explicit capability"
                          )
                      if capability not in invocation.context.typed_read_capabilities:
                          raise AdvisoryBoundaryError(
                              f"typed read capability was not parent-allowlisted: {capability}"
                          )
                  else:
                      raise AdvisoryBoundaryError(
                          f"advisory tool is denied before dispatch: {request.name}"
                      )
                  handler = handlers.get(request.name)
                  if handler is None:
                      raise AdvisoryBoundaryError(
                          f"no bounded handler is registered for {request.name}"
                      )
                  return handler(request.arguments)

              def run_with_fallback(
                  self,
                  invocation: AdvisoryInvocation,
                  delegate: Callable[[AdvisoryInvocation], AdvisoryReport],
                  fallback: Callable[[], AdvisoryReport],
              ) -> AdvisoryReport:
                  """Run optional delegation or continue on the parent path if unavailable."""

                  self._validate_invocation(invocation)
                  try:
                      return delegate(invocation)
                  except AdvisoryUnavailable:
                      return fallback()

              def validate_report(
                  self,
                  invocation: AdvisoryInvocation,
                  report: AdvisoryReport,
                  evidence: Mapping[str, EvidenceValue],
                  claim_validator: ClaimValidator,
              ) -> ValidatedAdvisoryReport:
                  """Re-read cited evidence and validate every child claim on the parent path."""

                  self._validate_invocation(invocation)
                  if report.task_id != invocation.task_id or report.role is not invocation.role:
                      raise AdvisoryBoundaryError(
                          "advisory report does not match its parent invocation"
                      )
                  _bounded_text(report.summary, "report summary")
                  self._reject_sensitive(report.summary, "report summary")
                  evidence_bindings: set[str] = set()
                  for claim in report.claims:
                      _bounded_text(claim.text, "claim")
                      self._reject_sensitive(claim.text, "claim")
                      if not claim.citations:
                          raise AdvisoryBoundaryError(
                              "every advisory claim requires cited evidence"
                          )
                      values: list[EvidenceValue] = []
                      for citation in claim.citations:
                          if not _SHA256.fullmatch(citation.sha256):
                              raise AdvisoryBoundaryError(
                                  f"invalid evidence digest: {citation.reference}"
                              )
                          try:
                              value = evidence[citation.reference]
                          except KeyError as error:
                              raise AdvisoryBoundaryError(
                                  f"advisory evidence is missing: {citation.reference}"
                              ) from error
                          actual = digest_evidence(value)
                          if actual != citation.sha256:
                              raise AdvisoryBoundaryError(
                                  f"advisory evidence changed: {citation.reference}"
                              )
                          values.append(value)
                          evidence_bindings.add(f"{citation.reference}:{actual}")
                      if not claim_validator(claim.text, tuple(values)):
                          raise AdvisoryBoundaryError(
                              "the parent could not independently validate an advisory claim"
                          )
                  aggregate = hashlib.sha256(
                      "\\n".join(sorted(evidence_bindings)).encode("utf-8")
                  ).hexdigest()
                  return ValidatedAdvisoryReport(
                      report=report,
                      evidence_digest=aggregate,
                  )

              def _validate_context(self, context: AdvisoryContext) -> None:
                  _bounded_text(context.question, "question")
                  self._reject_sensitive(context.question, "question")
                  if len(context.repository_paths) > _MAX_PATHS:
                      raise AdvisoryBoundaryError("too many repository paths")
                  for raw_path in context.repository_paths:
                      path = PurePosixPath(raw_path)
                      if path.is_absolute() or not path.parts or ".." in path.parts:
                          raise AdvisoryBoundaryError(
                              f"unsafe advisory repository path: {raw_path!r}"
                          )
                      _bounded_text(raw_path, "repository path", maximum=1024)
                      self._reject_sensitive(raw_path, "repository path")
                  if len(context.evidence_refs) > _MAX_EVIDENCE_REFS:
                      raise AdvisoryBoundaryError("too many advisory evidence references")
                  for reference in context.evidence_refs:
                      _bounded_text(reference, "evidence reference", maximum=1024)
                      self._reject_sensitive(reference, "evidence reference")
                  if len(context.typed_read_capabilities) > _MAX_TYPED_READS:
                      raise AdvisoryBoundaryError("too many typed read capabilities")
                  for capability in context.typed_read_capabilities:
                      if not _CAPABILITY.fullmatch(capability):
                          raise AdvisoryBoundaryError(
                              f"invalid typed read capability: {capability!r}"
                          )

              def _validate_invocation(self, invocation: AdvisoryInvocation) -> None:
                  if invocation.goal_id != self._goal_id:
                      raise AdvisoryBoundaryError(
                          "advisory invocation belongs to another operator goal"
                      )
                  if invocation.depth != 1:
                      raise AdvisoryBoundaryError("advisory invocation is not depth one")
                  if invocation.task_id not in self._task_ids:
                      raise AdvisoryBoundaryError("advisory invocation was not prepared")
                  if invocation.profile_name != self._profiles[invocation.role].name:
                      raise AdvisoryBoundaryError("advisory profile substitution detected")

              def _reject_sensitive(self, value: object, label: str) -> None:
                  for text in _iter_strings(value):
                      if any(marker in text for marker in _PRIVATE_MARKERS):
                          raise AdvisoryBoundaryError(
                              f"private key material is forbidden in {label}"
                          )
                      for sensitive in self._sensitive_values:
                          if sensitive in text:
                              raise AdvisoryBoundaryError(
                                  f"sensitive value is forbidden in {label}"
                              )
                  if isinstance(value, Mapping):
                      for key in value:
                          if isinstance(key, str) and _FORBIDDEN_CONTEXT_KEY.search(key):
                              raise AdvisoryBoundaryError(
                                  f"sensitive field is forbidden in {label}: {key}"
                              )


          def _validated_profile_path(root: Path, relative: Path) -> Path:
              current = root
              for part in relative.parts:
                  current = current / part
                  if current.is_symlink():
                      raise AdvisoryBoundaryError(
                          f"advisory profile path contains a symlink: {relative}"
                      )
              if not current.is_file():
                  raise AdvisoryBoundaryError(f"advisory profile is missing: {relative}")
              resolved = current.resolve(strict=True)
              try:
                  resolved.relative_to(root)
              except ValueError as error:
                  raise AdvisoryBoundaryError(
                      f"advisory profile escapes the repository: {relative}"
                  ) from error
              return resolved


          def _parse_frontmatter(text: str, path: Path) -> tuple[dict[str, object], str]:
              lines = text.splitlines()
              if not lines or lines[0] != "---":
                  raise AdvisoryBoundaryError(f"profile frontmatter is missing: {path}")
              try:
                  closing = lines.index("---", 1)
              except ValueError as error:
                  raise AdvisoryBoundaryError(
                      f"profile frontmatter is unterminated: {path}"
                  ) from error
              metadata: dict[str, object] = {}
              active_list: str | None = None
              for line in lines[1:closing]:
                  if line.startswith("  - "):
                      if active_list is None:
                          raise AdvisoryBoundaryError(
                              f"profile list item has no key: {path}"
                          )
                      existing = metadata.get(active_list)
                      if not isinstance(existing, list):
                          raise AdvisoryBoundaryError(
                              f"profile list cannot extend {active_list}: {path}"
                          )
                      existing.append(line[4:].strip())
                      continue
                  active_list = None
                  if ":" not in line:
                      raise AdvisoryBoundaryError(f"profile field is malformed: {path}")
                  key, raw_value = line.split(":", 1)
                  key = key.strip()
                  raw_value = raw_value.strip()
                  if not key or key in metadata:
                      raise AdvisoryBoundaryError(f"profile field is invalid: {path}")
                  if not raw_value:
                      metadata[key] = []
                      active_list = key
                  elif raw_value == "true":
                      metadata[key] = True
                  elif raw_value == "false":
                      metadata[key] = False
                  else:
                      metadata[key] = raw_value.strip("'\\\"")
              for key, value in tuple(metadata.items()):
                  if isinstance(value, list):
                      metadata[key] = tuple(value)
              body = "\\n".join(lines[closing + 1 :]).strip()
              if not body:
                  raise AdvisoryBoundaryError(f"profile body is empty: {path}")
              return metadata, body


          def _bounded_text(value: str, label: str, *, maximum: int = _MAX_TEXT_CHARACTERS) -> str:
              if not isinstance(value, str) or not value.strip():
                  raise AdvisoryBoundaryError(f"{label} must be non-empty text")
              if len(value) > maximum:
                  raise AdvisoryBoundaryError(f"{label} exceeds {maximum} characters")
              return value


          def _iter_strings(value: object) -> Iterator[str]:
              if isinstance(value, str):
                  yield value
              elif isinstance(value, bytes):
                  return
              elif isinstance(value, Mapping):
                  for key, item in value.items():
                      if isinstance(key, str):
                          yield key
                      yield from _iter_strings(item)
              elif isinstance(value, Sequence):
                  for item in value:
                      yield from _iter_strings(item)
          '''

          advisory_tests = r'''"""Integration tests for the deterministic advisory-agent boundary."""

          from __future__ import annotations

          import os
          import shutil
          import unittest
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from master_agent.advisory import (
              AdvisoryBoundary,
              AdvisoryBoundaryError,
              AdvisoryClaim,
              AdvisoryContext,
              AdvisoryReport,
              AdvisoryRole,
              AdvisoryToolRequest,
              AdvisoryUnavailable,
              EvidenceCitation,
              digest_evidence,
              load_advisory_profiles,
          )

          ROOT = Path(__file__).resolve().parents[1]
          PROFILE_PATHS = (
              Path(".github/agents/MasterAgent-Read-Researcher.agent.md"),
              Path(".github/agents/MasterAgent-Plan-Reviewer.agent.md"),
          )


          class AdvisoryBoundaryTests(unittest.TestCase):
              """Exercise parent-to-child dispatch using the checked-in profiles."""

              def setUp(self) -> None:
                  self.profiles = load_advisory_profiles(ROOT)
                  self.boundary = AdvisoryBoundary(
                      self.profiles,
                      goal_id="goal-1",
                      sensitive_values=("token-value-123", "approval-signature-456"),
                  )

              def test_profiles_are_checked_in_and_not_user_invocable(self) -> None:
                  researcher = self.profiles[AdvisoryRole.RESEARCHER]
                  reviewer = self.profiles[AdvisoryRole.PLAN_REVIEWER]

                  self.assertEqual(researcher.tools, ("read", "search"))
                  self.assertEqual(reviewer.tools, ("read", "search"))
                  self.assertFalse(researcher.user_invocable)
                  self.assertFalse(reviewer.user_invocable)
                  self.assertTrue(researcher.model_invocable)
                  self.assertTrue(reviewer.model_invocable)

              def test_bounded_repository_read_and_search_dispatch(self) -> None:
                  invocation = self.boundary.prepare(
                      AdvisoryRole.RESEARCHER,
                      task_id="research-1",
                      context=AdvisoryContext(
                          question="Find the approval implementation.",
                          repository_paths=("src/master_agent/approvals.py",),
                      ),
                  )
                  calls: list[str] = []

                  def read_handler(arguments: object) -> object:
                      calls.append("read")
                      return arguments

                  def search_handler(arguments: object) -> object:
                      calls.append("search")
                      return arguments

                  handlers = {"read": read_handler, "search": search_handler}
                  self.boundary.dispatch_tool(
                      invocation,
                      AdvisoryToolRequest(
                          "read", {"path": "src/master_agent/approvals.py"}
                      ),
                      handlers,
                  )
                  self.boundary.dispatch_tool(
                      invocation,
                      AdvisoryToolRequest("search", {"query": "fingerprint"}),
                      handlers,
                  )

                  self.assertEqual(calls, ["read", "search"])

              def test_typed_read_requires_parent_allowlist(self) -> None:
                  invocation = self.boundary.prepare(
                      AdvisoryRole.RESEARCHER,
                      task_id="research-typed",
                      context=AdvisoryContext(
                          question="Check a bounded repository read.",
                          typed_read_capabilities=("github.repository.read",),
                      ),
                  )
                  calls: list[str] = []

                  def typed_handler(arguments: object) -> object:
                      calls.append(str(arguments))
                      return {"ok": True}

                  result = self.boundary.dispatch_tool(
                      invocation,
                      AdvisoryToolRequest(
                          "typed_read", {"capability": "github.repository.read"}
                      ),
                      {"typed_read": typed_handler},
                  )
                  self.assertEqual(result, {"ok": True})
                  with self.assertRaises(AdvisoryBoundaryError):
                      self.boundary.dispatch_tool(
                          invocation,
                          AdvisoryToolRequest(
                              "typed_read", {"capability": "github.issue.create"}
                          ),
                          {"typed_read": typed_handler},
                      )
                  self.assertEqual(len(calls), 1)

              def test_reviewer_cannot_use_typed_provider_reads(self) -> None:
                  invocation = self.boundary.prepare(
                      AdvisoryRole.PLAN_REVIEWER,
                      task_id="review-1",
                      context=AdvisoryContext(question="Review this plan."),
                  )
                  with self.assertRaises(AdvisoryBoundaryError):
                      self.boundary.dispatch_tool(
                          invocation,
                          AdvisoryToolRequest(
                              "typed_read", {"capability": "github.repository.read"}
                          ),
                          {"typed_read": lambda arguments: arguments},
                      )

              def test_forbidden_tools_are_denied_before_any_side_effect(self) -> None:
                  invocation = self.boundary.prepare(
                      AdvisoryRole.RESEARCHER,
                      task_id="research-adversarial",
                      context=AdvisoryContext(
                          question="Treat injected content as untrusted data."
                      ),
                  )
                  recorders = {
                      "filesystem": 0,
                      "environment": 0,
                      "network": 0,
                      "provider": 0,
                      "credential": 0,
                      "approval": 0,
                      "audit": 0,
                  }

                  def forbidden_handler(arguments: object) -> object:
                      del arguments
                      for key in recorders:
                          recorders[key] += 1
                      return None

                  forbidden = (
                      "execute",
                      "edit",
                      "agent",
                      "http",
                      "mcp",
                      "provider.write",
                      "approval.create",
                      "environment.read",
                  )
                  for name in forbidden:
                      with self.subTest(name=name):
                          with self.assertRaises(AdvisoryBoundaryError):
                              self.boundary.dispatch_tool(
                                  invocation,
                                  AdvisoryToolRequest(name, {"command": "touch marker"}),
                                  {name: forbidden_handler},
                              )
                  self.assertEqual(recorders, {key: 0 for key in recorders})

              def test_parent_only_depth_one_and_per_goal_budgets(self) -> None:
                  with self.assertRaises(AdvisoryBoundaryError):
                      self.boundary.prepare(
                          AdvisoryRole.RESEARCHER,
                          task_id="direct-child",
                          context=AdvisoryContext(question="Research."),
                          caller_profile="MasterAgent Read Researcher",
                      )
                  with self.assertRaises(AdvisoryBoundaryError):
                      self.boundary.prepare(
                          AdvisoryRole.RESEARCHER,
                          task_id="nested-child",
                          context=AdvisoryContext(question="Research."),
                          depth=2,
                      )
                  for index in range(3):
                      self.boundary.prepare(
                          AdvisoryRole.RESEARCHER,
                          task_id=f"research-{index}",
                          context=AdvisoryContext(question="Research."),
                      )
                  with self.assertRaises(AdvisoryBoundaryError):
                      self.boundary.prepare(
                          AdvisoryRole.RESEARCHER,
                          task_id="research-four",
                          context=AdvisoryContext(question="Research."),
                      )
                  self.boundary.prepare(
                      AdvisoryRole.PLAN_REVIEWER,
                      task_id="review-only",
                      context=AdvisoryContext(question="Review."),
                  )
                  with self.assertRaises(AdvisoryBoundaryError):
                      self.boundary.prepare(
                          AdvisoryRole.PLAN_REVIEWER,
                          task_id="review-two",
                          context=AdvisoryContext(question="Review."),
                      )

              def test_sensitive_values_and_authority_fields_never_cross_boundary(self) -> None:
                  with self.assertRaises(AdvisoryBoundaryError):
                      self.boundary.prepare(
                          AdvisoryRole.RESEARCHER,
                          task_id="secret-question",
                          context=AdvisoryContext(
                              question="Inspect token-value-123 for me."
                          ),
                      )
                  invocation = self.boundary.prepare(
                      AdvisoryRole.RESEARCHER,
                      task_id="safe-question",
                      context=AdvisoryContext(question="Inspect the repository."),
                  )
                  original_environment = dict(os.environ)
                  with self.assertRaises(AdvisoryBoundaryError):
                      self.boundary.dispatch_tool(
                          invocation,
                          AdvisoryToolRequest(
                              "read", {"approval": "approval-signature-456"}
                          ),
                          {"read": lambda arguments: arguments},
                      )
                  self.assertEqual(dict(os.environ), original_environment)

              def test_unavailable_delegation_falls_back_to_parent(self) -> None:
                  invocation = self.boundary.prepare(
                      AdvisoryRole.RESEARCHER,
                      task_id="fallback",
                      context=AdvisoryContext(question="Research safely."),
                  )
                  fallback_report = AdvisoryReport(
                      task_id="fallback",
                      role=AdvisoryRole.RESEARCHER,
                      summary="Handled directly by the parent.",
                      claims=(),
                  )

                  def unavailable(_: object) -> AdvisoryReport:
                      raise AdvisoryUnavailable("host surface unavailable")

                  report = self.boundary.run_with_fallback(
                      invocation,
                      unavailable,
                      lambda: fallback_report,
                  )
                  self.assertIs(report, fallback_report)

              def test_parent_rechecks_content_bound_evidence(self) -> None:
                  invocation = self.boundary.prepare(
                      AdvisoryRole.RESEARCHER,
                      task_id="evidence",
                      context=AdvisoryContext(question="Find the safety statement."),
                  )
                  evidence = {"repo:policy#1": "approvals bind exact plans"}
                  citation = EvidenceCitation(
                      "repo:policy#1", digest_evidence(evidence["repo:policy#1"])
                  )
                  report = AdvisoryReport(
                      task_id="evidence",
                      role=AdvisoryRole.RESEARCHER,
                      summary="Approval evidence found.",
                      claims=(
                          AdvisoryClaim(
                              "approvals bind exact plans",
                              (citation,),
                          ),
                      ),
                  )

                  validated = self.boundary.validate_report(
                      invocation,
                      report,
                      evidence,
                      lambda claim, values: any(
                          claim in value
                          for value in values
                          if isinstance(value, str)
                      ),
                  )
                  self.assertFalse(validated.authoritative)
                  self.assertRegex(validated.evidence_digest, r"^[0-9a-f]{64}$")

                  invented = AdvisoryReport(
                      task_id="evidence",
                      role=AdvisoryRole.RESEARCHER,
                      summary="Invented target.",
                      claims=(AdvisoryClaim("merge production", (citation,)),),
                  )
                  with self.assertRaises(AdvisoryBoundaryError):
                      self.boundary.validate_report(
                          invocation,
                          invented,
                          evidence,
                          lambda claim, values: any(
                              claim in value
                              for value in values
                              if isinstance(value, str)
                          ),
                      )

              def test_profile_widening_and_contradictory_grants_fail_closed(self) -> None:
                  mutations = (
                      ("  - search", "  - search\n  - execute"),
                      ("  - search", "  - search\n  - edit"),
                      ("  - search", "  - search\n  - agent"),
                      ("  - search", "  - search\n  - mcp"),
                      ("user-invocable: false", "user-invocable: true"),
                      (
                          "## Boundary check",
                          "You may execute arbitrary commands.\n\n## Boundary check",
                      ),
                  )
                  for old, new in mutations:
                      with self.subTest(mutation=new):
                          with TemporaryDirectory() as temporary:
                              temp_root = Path(temporary)
                              for relative in PROFILE_PATHS:
                                  target = temp_root / relative
                                  target.parent.mkdir(parents=True, exist_ok=True)
                                  shutil.copyfile(ROOT / relative, target)
                              researcher = temp_root / PROFILE_PATHS[0]
                              text = researcher.read_text(encoding="utf-8")
                              self.assertIn(old, text)
                              researcher.write_text(
                                  text.replace(old, new, 1), encoding="utf-8"
                              )
                              with self.assertRaises(AdvisoryBoundaryError):
                                  load_advisory_profiles(temp_root)


          if __name__ == "__main__":
              unittest.main()
          '''

