name: One-time live connector environment probe

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  read-environment:
    if: >-
      github.actor == 'RoryGlenn' &&
      github.head_ref == 'agent/live-connector-run-once'
    runs-on: ubuntu-latest
    environment: connector-integration-read
    env:
      MASTER_AGENT_LIVE_INTEGRATIONS_TOML: ${{ secrets.MASTER_AGENT_LIVE_INTEGRATIONS_TOML }}
      MASTER_AGENT_JIRA_USERNAME: ${{ secrets.MASTER_AGENT_JIRA_USERNAME }}
      MASTER_AGENT_JIRA_TOKEN: ${{ secrets.MASTER_AGENT_JIRA_TOKEN }}
      MASTER_AGENT_CONFLUENCE_USERNAME: ${{ secrets.MASTER_AGENT_CONFLUENCE_USERNAME }}
      MASTER_AGENT_CONFLUENCE_TOKEN: ${{ secrets.MASTER_AGENT_CONFLUENCE_TOKEN }}
      MASTER_AGENT_BITBUCKET_USERNAME: ${{ secrets.MASTER_AGENT_BITBUCKET_USERNAME }}
      MASTER_AGENT_BITBUCKET_TOKEN: ${{ secrets.MASTER_AGENT_BITBUCKET_TOKEN }}
      MASTER_AGENT_GITHUB_TOKEN: ${{ secrets.MASTER_AGENT_GITHUB_TOKEN }}
      MASTER_AGENT_GRAPH_ACCESS_TOKEN: ${{ secrets.MASTER_AGENT_GRAPH_ACCESS_TOKEN }}
      MASTER_AGENT_GRAPH_TOKEN_FILE_JSON: ${{ secrets.MASTER_AGENT_GRAPH_TOKEN_FILE_JSON }}
      MASTER_AGENT_ENTRA_TENANT_ID: ${{ secrets.MASTER_AGENT_ENTRA_TENANT_ID }}
      MASTER_AGENT_ENTRA_APP_CLIENT_ID: ${{ secrets.MASTER_AGENT_ENTRA_APP_CLIENT_ID }}
      MASTER_AGENT_ENTRA_APP_CLIENT_SECRET: ${{ secrets.MASTER_AGENT_ENTRA_APP_CLIENT_SECRET }}
      MASTER_AGENT_LIVE_JIRA_ISSUE_ID: ${{ vars.MASTER_AGENT_LIVE_JIRA_ISSUE_ID }}
      MASTER_AGENT_LIVE_CONFLUENCE_PAGE_ID: ${{ vars.MASTER_AGENT_LIVE_CONFLUENCE_PAGE_ID }}
      MASTER_AGENT_LIVE_BITBUCKET_WORKSPACE: ${{ vars.MASTER_AGENT_LIVE_BITBUCKET_WORKSPACE }}
      MASTER_AGENT_LIVE_BITBUCKET_REPOSITORY: ${{ vars.MASTER_AGENT_LIVE_BITBUCKET_REPOSITORY }}
      MASTER_AGENT_LIVE_GITHUB_OWNER: ${{ vars.MASTER_AGENT_LIVE_GITHUB_OWNER }}
      MASTER_AGENT_LIVE_GITHUB_REPOSITORY: ${{ vars.MASTER_AGENT_LIVE_GITHUB_REPOSITORY }}
      MASTER_AGENT_LIVE_SHAREPOINT_SITE_ID: ${{ vars.MASTER_AGENT_LIVE_SHAREPOINT_SITE_ID }}
      MASTER_AGENT_LIVE_OUTLOOK_MESSAGE_ID: ${{ vars.MASTER_AGENT_LIVE_OUTLOOK_MESSAGE_ID }}
      MASTER_AGENT_LIVE_TEAMS_CHAT_ID: ${{ vars.MASTER_AGENT_LIVE_TEAMS_CHAT_ID }}
      MASTER_AGENT_LIVE_TEAMS_MESSAGE_ID: ${{ vars.MASTER_AGENT_LIVE_TEAMS_MESSAGE_ID }}
      MASTER_AGENT_LIVE_ONENOTE_PAGE_ID: ${{ vars.MASTER_AGENT_LIVE_ONENOTE_PAGE_ID }}
    steps:
      - name: Report missing read-environment names without exposing values
        run: |
          python3 - <<'PY'
          import os

          required = [
              "MASTER_AGENT_LIVE_INTEGRATIONS_TOML",
              "MASTER_AGENT_JIRA_USERNAME",
              "MASTER_AGENT_JIRA_TOKEN",
              "MASTER_AGENT_CONFLUENCE_USERNAME",
              "MASTER_AGENT_CONFLUENCE_TOKEN",
              "MASTER_AGENT_BITBUCKET_USERNAME",
              "MASTER_AGENT_BITBUCKET_TOKEN",
              "MASTER_AGENT_GITHUB_TOKEN",
              "MASTER_AGENT_LIVE_JIRA_ISSUE_ID",
              "MASTER_AGENT_LIVE_CONFLUENCE_PAGE_ID",
              "MASTER_AGENT_LIVE_BITBUCKET_WORKSPACE",
              "MASTER_AGENT_LIVE_BITBUCKET_REPOSITORY",
              "MASTER_AGENT_LIVE_GITHUB_OWNER",
              "MASTER_AGENT_LIVE_GITHUB_REPOSITORY",
              "MASTER_AGENT_LIVE_SHAREPOINT_SITE_ID",
              "MASTER_AGENT_LIVE_OUTLOOK_MESSAGE_ID",
              "MASTER_AGENT_LIVE_TEAMS_CHAT_ID",
              "MASTER_AGENT_LIVE_TEAMS_MESSAGE_ID",
              "MASTER_AGENT_LIVE_ONENOTE_PAGE_ID",
          ]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          graph_ready = bool(os.environ.get("MASTER_AGENT_GRAPH_ACCESS_TOKEN", "").strip()) or bool(
              os.environ.get("MASTER_AGENT_GRAPH_TOKEN_FILE_JSON", "").strip()
          ) or all(
              os.environ.get(name, "").strip()
              for name in (
                  "MASTER_AGENT_ENTRA_TENANT_ID",
                  "MASTER_AGENT_ENTRA_APP_CLIENT_ID",
                  "MASTER_AGENT_ENTRA_APP_CLIENT_SECRET",
              )
          )
          if not graph_ready:
              missing.append("MICROSOFT_GRAPH_CREDENTIAL_SET")
          if missing:
              print("MISSING_READ_ENVIRONMENT_NAMES=" + ",".join(missing))
              raise SystemExit(1)
          print("READ_ENVIRONMENT_READY=true")
          PY

  effects-environment:
    if: >-
      github.actor == 'RoryGlenn' &&
      github.head_ref == 'agent/live-connector-run-once'
    runs-on: ubuntu-latest
    environment: connector-integration-effects
    env:
      MASTER_AGENT_LIVE_INTEGRATIONS_TOML: ${{ secrets.MASTER_AGENT_LIVE_INTEGRATIONS_TOML }}
      MASTER_AGENT_JIRA_USERNAME: ${{ secrets.MASTER_AGENT_JIRA_USERNAME }}
      MASTER_AGENT_JIRA_TOKEN: ${{ secrets.MASTER_AGENT_JIRA_TOKEN }}
      MASTER_AGENT_CONFLUENCE_USERNAME: ${{ secrets.MASTER_AGENT_CONFLUENCE_USERNAME }}
      MASTER_AGENT_CONFLUENCE_TOKEN: ${{ secrets.MASTER_AGENT_CONFLUENCE_TOKEN }}
      MASTER_AGENT_BITBUCKET_USERNAME: ${{ secrets.MASTER_AGENT_BITBUCKET_USERNAME }}
      MASTER_AGENT_BITBUCKET_TOKEN: ${{ secrets.MASTER_AGENT_BITBUCKET_TOKEN }}
      MASTER_AGENT_GITHUB_TOKEN: ${{ secrets.MASTER_AGENT_GITHUB_TOKEN }}
      MASTER_AGENT_GRAPH_ACCESS_TOKEN: ${{ secrets.MASTER_AGENT_GRAPH_ACCESS_TOKEN }}
      MASTER_AGENT_GRAPH_TOKEN_FILE_JSON: ${{ secrets.MASTER_AGENT_GRAPH_TOKEN_FILE_JSON }}
      MASTER_AGENT_ENTRA_TENANT_ID: ${{ secrets.MASTER_AGENT_ENTRA_TENANT_ID }}
      MASTER_AGENT_ENTRA_APP_CLIENT_ID: ${{ secrets.MASTER_AGENT_ENTRA_APP_CLIENT_ID }}
      MASTER_AGENT_ENTRA_APP_CLIENT_SECRET: ${{ secrets.MASTER_AGENT_ENTRA_APP_CLIENT_SECRET }}
      MASTER_AGENT_LIVE_NON_PRODUCTION: ${{ vars.MASTER_AGENT_LIVE_NON_PRODUCTION }}
      MASTER_AGENT_LIVE_JIRA_ISSUE_ID: ${{ vars.MASTER_AGENT_LIVE_JIRA_ISSUE_ID }}
      MASTER_AGENT_LIVE_CONFLUENCE_SPACE_ID: ${{ vars.MASTER_AGENT_LIVE_CONFLUENCE_SPACE_ID }}
      MASTER_AGENT_LIVE_BITBUCKET_WORKSPACE: ${{ vars.MASTER_AGENT_LIVE_BITBUCKET_WORKSPACE }}
      MASTER_AGENT_LIVE_BITBUCKET_REPOSITORY: ${{ vars.MASTER_AGENT_LIVE_BITBUCKET_REPOSITORY }}
      MASTER_AGENT_LIVE_BITBUCKET_SOURCE_BRANCH: ${{ vars.MASTER_AGENT_LIVE_BITBUCKET_SOURCE_BRANCH }}
      MASTER_AGENT_LIVE_BITBUCKET_DESTINATION_BRANCH: ${{ vars.MASTER_AGENT_LIVE_BITBUCKET_DESTINATION_BRANCH }}
      MASTER_AGENT_LIVE_GITHUB_OWNER: ${{ vars.MASTER_AGENT_LIVE_GITHUB_OWNER }}
      MASTER_AGENT_LIVE_GITHUB_REPOSITORY: ${{ vars.MASTER_AGENT_LIVE_GITHUB_REPOSITORY }}
      MASTER_AGENT_LIVE_SHAREPOINT_DRIVE_ID: ${{ vars.MASTER_AGENT_LIVE_SHAREPOINT_DRIVE_ID }}
      MASTER_AGENT_LIVE_SHAREPOINT_ITEM_ID: ${{ vars.MASTER_AGENT_LIVE_SHAREPOINT_ITEM_ID }}
      MASTER_AGENT_LIVE_OUTLOOK_RECIPIENT: ${{ vars.MASTER_AGENT_LIVE_OUTLOOK_RECIPIENT }}
      MASTER_AGENT_LIVE_TEAMS_CHAT_ID: ${{ vars.MASTER_AGENT_LIVE_TEAMS_CHAT_ID }}
    steps:
      - name: Report missing effects-environment names without exposing values
        run: |
          python3 - <<'PY'
          import os

          required = [
              "MASTER_AGENT_LIVE_INTEGRATIONS_TOML",
              "MASTER_AGENT_JIRA_USERNAME",
              "MASTER_AGENT_JIRA_TOKEN",
              "MASTER_AGENT_CONFLUENCE_USERNAME",
              "MASTER_AGENT_CONFLUENCE_TOKEN",
              "MASTER_AGENT_BITBUCKET_USERNAME",
              "MASTER_AGENT_BITBUCKET_TOKEN",
              "MASTER_AGENT_GITHUB_TOKEN",
              "MASTER_AGENT_LIVE_NON_PRODUCTION",
              "MASTER_AGENT_LIVE_JIRA_ISSUE_ID",
              "MASTER_AGENT_LIVE_CONFLUENCE_SPACE_ID",
              "MASTER_AGENT_LIVE_BITBUCKET_WORKSPACE",
              "MASTER_AGENT_LIVE_BITBUCKET_REPOSITORY",
              "MASTER_AGENT_LIVE_BITBUCKET_SOURCE_BRANCH",
              "MASTER_AGENT_LIVE_BITBUCKET_DESTINATION_BRANCH",
              "MASTER_AGENT_LIVE_GITHUB_OWNER",
              "MASTER_AGENT_LIVE_GITHUB_REPOSITORY",
              "MASTER_AGENT_LIVE_SHAREPOINT_DRIVE_ID",
              "MASTER_AGENT_LIVE_SHAREPOINT_ITEM_ID",
              "MASTER_AGENT_LIVE_OUTLOOK_RECIPIENT",
              "MASTER_AGENT_LIVE_TEAMS_CHAT_ID",
          ]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          graph_ready = bool(os.environ.get("MASTER_AGENT_GRAPH_ACCESS_TOKEN", "").strip()) or bool(
              os.environ.get("MASTER_AGENT_GRAPH_TOKEN_FILE_JSON", "").strip()
          ) or all(
              os.environ.get(name, "").strip()
              for name in (
                  "MASTER_AGENT_ENTRA_TENANT_ID",
                  "MASTER_AGENT_ENTRA_APP_CLIENT_ID",
                  "MASTER_AGENT_ENTRA_APP_CLIENT_SECRET",
              )
          )
          if not graph_ready:
              missing.append("MICROSOFT_GRAPH_CREDENTIAL_SET")
          if missing:
              print("MISSING_EFFECTS_ENVIRONMENT_NAMES=" + ",".join(missing))
              raise SystemExit(1)
          print("EFFECTS_ENVIRONMENT_READY=true")
          PY

  admin-environment:
    if: >-
      github.actor == 'RoryGlenn' &&
      github.head_ref == 'agent/live-connector-run-once'
    runs-on: ubuntu-latest
    environment: connector-integration-admin
    env:
      MASTER_AGENT_LIVE_INTEGRATIONS_TOML: ${{ secrets.MASTER_AGENT_LIVE_INTEGRATIONS_TOML }}
      MASTER_AGENT_GITHUB_TOKEN: ${{ secrets.MASTER_AGENT_GITHUB_TOKEN }}
      MASTER_AGENT_LIVE_GITHUB_ADMIN_NON_PRODUCTION: ${{ vars.MASTER_AGENT_LIVE_GITHUB_ADMIN_NON_PRODUCTION }}
      MASTER_AGENT_LIVE_GITHUB_ADMIN_OWNER: ${{ vars.MASTER_AGENT_LIVE_GITHUB_ADMIN_OWNER }}
      MASTER_AGENT_LIVE_GITHUB_ADMIN_REPOSITORY: ${{ vars.MASTER_AGENT_LIVE_GITHUB_ADMIN_REPOSITORY }}
      MASTER_AGENT_LIVE_GITHUB_ADMIN_SETTING: ${{ vars.MASTER_AGENT_LIVE_GITHUB_ADMIN_SETTING }}
    steps:
      - name: Report missing admin-environment names without exposing values
        run: |
          python3 - <<'PY'
          import os

          required = [
              "MASTER_AGENT_LIVE_INTEGRATIONS_TOML",
              "MASTER_AGENT_GITHUB_TOKEN",
              "MASTER_AGENT_LIVE_GITHUB_ADMIN_NON_PRODUCTION",
              "MASTER_AGENT_LIVE_GITHUB_ADMIN_OWNER",
              "MASTER_AGENT_LIVE_GITHUB_ADMIN_REPOSITORY",
              "MASTER_AGENT_LIVE_GITHUB_ADMIN_SETTING",
          ]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              print("MISSING_ADMIN_ENVIRONMENT_NAMES=" + ",".join(missing))
              raise SystemExit(1)
          print("ADMIN_ENVIRONMENT_READY=true")
          PY
