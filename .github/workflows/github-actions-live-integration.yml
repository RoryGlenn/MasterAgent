name: GitHub connector live integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 2"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-actions-live-integration.yml"
      - "tests/test_github_actions_live_integration.py"
      - "src/master_agent/connectors/github.py"
      - "src/master_agent/connectors/github_write.py"
      - "src/master_agent/connectors/factory.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: github-connector-live-integration
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  repository-and-issue-lifecycle:
    name: Repository read and issue lifecycle
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Seal hosted Python runtime
        run: |
          test -n "${RUNNER_TOOL_CACHE:-}"
          test -n "${pythonLocation:-}"
          case "$pythonLocation" in
            "$RUNNER_TOOL_CACHE"/*) ;;
            *) exit 1 ;;
          esac
          sudo chmod -R go-w -- "$pythonLocation"
      - name: Install reviewed project
        run: |
          umask 077
          runtime_env="$RUNNER_TEMP/master-agent-github-live"
          python -m venv "$runtime_env"
          "$runtime_env/bin/python" -m pip install .
          echo "$runtime_env/bin" >> "$GITHUB_PATH"
      - name: Materialize the repository-scoped connector configuration
        run: |
          set -euo pipefail
          umask 077
          integrations="$RUNNER_TEMP/master-agent-github-live.toml"
          cat > "$integrations" <<'TOML'
          [connectors.github]
          enabled = true
          deployment = "cloud"
          base_url = "https://api.github.com"
          auth_mode = "bearer"
          secret_env = "MASTER_AGENT_GITHUB_TOKEN"
          timeout_seconds = 20
          max_pages = 10
          max_items = 100
          max_response_bytes = 10485760
          writes_enabled = true
          write_enabled = true
          admin_enabled = false
          TOML
          chmod 600 "$integrations"
          echo "MASTER_AGENT_LIVE_INTEGRATIONS_FILE=$integrations" >> "$GITHUB_ENV"
      - name: Run real repository reads and issue create/close lifecycle
        env:
          MASTER_AGENT_RUN_GITHUB_ACTIONS_LIVE_TESTS: "1"
          MASTER_AGENT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MASTER_AGENT_LIVE_GITHUB_OWNER: ${{ github.repository_owner }}
          MASTER_AGENT_LIVE_GITHUB_REPOSITORY: ${{ github.event.repository.name }}
          MASTER_AGENT_LIVE_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python -m unittest
          tests.test_github_actions_live_integration.GitHubActionsLiveIntegrationTests
          -v
