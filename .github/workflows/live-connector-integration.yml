name: Credentialed connector integration

on:
  workflow_dispatch:
    inputs:
      run_effects:
        description: Run protected sandbox writes and test communications
        required: false
        type: boolean
        default: false
      run_github_admin:
        description: Toggle and restore one setting in the admin sandbox repository
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "43 6 * * 2"

permissions:
  contents: read

concurrency:
  group: credentialed-connector-integration
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  credentialed-read:
    name: Credentialed read connectors
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.MASTER_AGENT_LIVE_CONNECTOR_TESTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: connector-integration-read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Seal hosted Python runtime
        run: |
          test -n "${RUNNER_TOOL_CACHE:-}"
          test -n "${pythonLocation:-}"
          case "$pythonLocation" in
            "$RUNNER_TOOL_CACHE"/*) ;;
            *) exit 1 ;;
          esac
          sudo chmod -R go-w -- "$pythonLocation"
      - name: Install reviewed project
        run: |
          umask 077
          runtime_env="$RUNNER_TEMP/master-agent-live-read"
          python -m venv "$runtime_env"
          "$runtime_env/bin/python" -m pip install .
          echo "$runtime_env/bin" >> "$GITHUB_PATH"
      - name: Materialize private connector configuration
        env:
          LIVE_INTEGRATIONS_TOML: ${{ secrets.MASTER_AGENT_LIVE_INTEGRATIONS_TOML }}
          GRAPH_TOKEN_FILE_JSON: ${{ secrets.MASTER_AGENT_GRAPH_TOKEN_FILE_JSON }}
          ENTERPRISE_CA_BUNDLE_PEM: ${{ secrets.MASTER_AGENT_ENTERPRISE_CA_BUNDLE_PEM }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$LIVE_INTEGRATIONS_TOML"
          integrations="$RUNNER_TEMP/master-agent-live-integrations.toml"
          printf '%s' "$LIVE_INTEGRATIONS_TOML" > "$integrations"
          echo "MASTER_AGENT_LIVE_INTEGRATIONS_FILE=$integrations" >> "$GITHUB_ENV"
          if test -n "$GRAPH_TOKEN_FILE_JSON"; then
            token_file="$RUNNER_TEMP/master-agent-graph-token.json"
            printf '%s' "$GRAPH_TOKEN_FILE_JSON" > "$token_file"
            echo "MASTER_AGENT_GRAPH_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          fi
          if test -n "$ENTERPRISE_CA_BUNDLE_PEM"; then
            ca_file="$RUNNER_TEMP/master-agent-enterprise-ca.pem"
            printf '%s' "$ENTERPRISE_CA_BUNDLE_PEM" > "$ca_file"
            echo "MASTER_AGENT_ENTERPRISE_CA_BUNDLE=$ca_file" >> "$GITHUB_ENV"
          fi
      - name: Run real provider reads and independent re-reads
        env:
          MASTER_AGENT_RUN_LIVE_CONNECTOR_TESTS: "1"
          MASTER_AGENT_LIVE_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          MASTER_AGENT_JIRA_USERNAME: ${{ secrets.MASTER_AGENT_JIRA_USERNAME }}
          MASTER_AGENT_JIRA_TOKEN: ${{ secrets.MASTER_AGENT_JIRA_TOKEN }}
          MASTER_AGENT_CONFLUENCE_USERNAME: ${{ secrets.MASTER_AGENT_CONFLUENCE_USERNAME }}
          MASTER_AGENT_CONFLUENCE_TOKEN: ${{ secrets.MASTER_AGENT_CONFLUENCE_TOKEN }}
          MASTER_AGENT_BITBUCKET_USERNAME: ${{ secrets.MASTER_AGENT_BITBUCKET_USERNAME }}
          MASTER_AGENT_BITBUCKET_TOKEN: ${{ secrets.MASTER_AGENT_BITBUCKET_TOKEN }}
          MASTER_AGENT_GITHUB_TOKEN: ${{ secrets.MASTER_AGENT_GITHUB_TOKEN }}
          MASTER_AGENT_GRAPH_ACCESS_TOKEN: ${{ secrets.MASTER_AGENT_GRAPH_ACCESS_TOKEN }}
          MASTER_AGENT_GRAPH_ACCESS_TOKEN_EXPIRES_AT: ${{ secrets.MASTER_AGENT_GRAPH_ACCESS_TOKEN_EXPIRES_AT }}
          MASTER_AGENT_ENTRA_TENANT_ID: ${{ secrets.MASTER_AGENT_ENTRA_TENANT_ID }}
          MASTER_AGENT_ENTRA_APP_CLIENT_ID: ${{ secrets.MASTER_AGENT_ENTRA_APP_CLIENT_ID }}
          MASTER_AGENT_ENTRA_APP_CLIENT_SECRET: ${{ secrets.MASTER_AGENT_ENTRA_APP_CLIENT_SECRET }}
          MASTER_AGENT_LIVE_JIRA_ISSUE_ID: ${{ vars.MASTER_AGENT_LIVE_JIRA_ISSUE_ID }}
          MASTER_AGENT_LIVE_CONFLUENCE_PAGE_ID: ${{ vars.MASTER_AGENT_LIVE_CONFLUENCE_PAGE_ID }}
          MASTER_AGENT_LIVE_BITBUCKET_WORKSPACE: ${{ vars.MASTER_AGENT_LIVE_BITBUCKET_WORKSPACE }}
          MASTER_AGENT_LIVE_BITBUCKET_REPOSITORY: ${{ vars.MASTER_AGENT_LIVE_BITBUCKET_REPOSITORY }}
          MASTER_AGENT_LIVE_GITHUB_OWNER: ${{ vars.MASTER_AGENT_LIVE_GITHUB_OWNER }}
          MASTER_AGENT_LIVE_GITHUB_REPOSITORY: ${{ vars.MASTER_AGENT_LIVE_GITHUB_REPOSITORY }}
          MASTER_AGENT_LIVE_MICROSOFT_IDENTITY: ${{ vars.MASTER_AGENT_LIVE_MICROSOFT_IDENTITY }}
          MASTER_AGENT_LIVE_SHAREPOINT_SITE_ID: ${{ vars.MASTER_AGENT_LIVE_SHAREPOINT_SITE_ID }}
          MASTER_AGENT_LIVE_OUTLOOK_MESSAGE_ID: ${{ vars.MASTER_AGENT_LIVE_OUTLOOK_MESSAGE_ID }}
          MASTER_AGENT_LIVE_TEAMS_CHAT_ID: ${{ vars.MASTER_AGENT_LIVE_TEAMS_CHAT_ID }}
          MASTER_AGENT_LIVE_TEAMS_MESSAGE_ID: ${{ vars.MASTER_AGENT_LIVE_TEAMS_MESSAGE_ID }}
          MASTER_AGENT_LIVE_ONENOTE_PAGE_ID: ${{ vars.MASTER_AGENT_LIVE_ONENOTE_PAGE_ID }}
        run: >-
          python -m unittest
          tests.test_connector_integration_matrix.CredentialedReadConnectorIntegrationTests
          -v

  sandbox-effects:
    name: Protected connector effects
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_effects &&
      vars.MASTER_AGENT_LIVE_EFFECT_TESTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: connector-integration-effects
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Seal hosted Python runtime
        run: |
          test -n "${RUNNER_TOOL_CACHE:-}"
          test -n "${pythonLocation:-}"
          case "$pythonLocation" in
            "$RUNNER_TOOL_CACHE"/*) ;;
            *) exit 1 ;;
          esac
          sudo chmod -R go-w -- "$pythonLocation"
      - name: Install reviewed project
        run: |
          umask 077
          runtime_env="$RUNNER_TEMP/master-agent-live-effects"
          python -m venv "$runtime_env"
          "$runtime_env/bin/python" -m pip install .
          echo "$runtime_env/bin" >> "$GITHUB_PATH"
      - name: Materialize private connector configuration
        env:
          LIVE_INTEGRATIONS_TOML: ${{ secrets.MASTER_AGENT_LIVE_INTEGRATIONS_TOML }}
          GRAPH_TOKEN_FILE_JSON: ${{ secrets.MASTER_AGENT_GRAPH_TOKEN_FILE_JSON }}
          ENTERPRISE_CA_BUNDLE_PEM: ${{ secrets.MASTER_AGENT_ENTERPRISE_CA_BUNDLE_PEM }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$LIVE_INTEGRATIONS_TOML"
          integrations="$RUNNER_TEMP/master-agent-live-integrations.toml"
          printf '%s' "$LIVE_INTEGRATIONS_TOML" > "$integrations"
          echo "MASTER_AGENT_LIVE_INTEGRATIONS_FILE=$integrations" >> "$GITHUB_ENV"
          if test -n "$GRAPH_TOKEN_FILE_JSON"; then
            token_file="$RUNNER_TEMP/master-agent-graph-token.json"
            printf '%s' "$GRAPH_TOKEN_FILE_JSON" > "$token_file"
            echo "MASTER_AGENT_GRAPH_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          fi
          if test -n "$ENTERPRISE_CA_BUNDLE_PEM"; then
            ca_file="$RUNNER_TEMP/master-agent-enterprise-ca.pem"
            printf '%s' "$ENTERPRISE_CA_BUNDLE_PEM" > "$ca_file"
            echo "MASTER_AGENT_ENTERPRISE_CA_BUNDLE=$ca_file" >> "$GITHUB_ENV"
          fi
      - name: Run sandbox writes, compensation, and test communications
        env:
          MASTER_AGENT_RUN_LIVE_EFFECT_TESTS: "1"
          MASTER_AGENT_LIVE_NON_PRODUCTION: ${{ vars.MASTER_AGENT_LIVE_NON_PRODUCTION }}
          MASTER_AGENT_LIVE_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          MASTER_AGENT_JIRA_USERNAME: ${{ secrets.MASTER_AGENT_JIRA_USERNAME }}
          MASTER_AGENT_JIRA_TOKEN: ${{ secrets.MASTER_AGENT_JIRA_TOKEN }}
          MASTER_AGENT_CONFLUENCE_USERNAME: ${{ secrets.MASTER_AGENT_CONFLUENCE_USERNAME }}
          MASTER_AGENT_CONFLUENCE_TOKEN: ${{ secrets.MASTER_AGENT_CONFLUENCE_TOKEN }}
          MASTER_AGENT_BITBUCKET_USERNAME: ${{ secrets.MASTER_AGENT_BITBUCKET_USERNAME }}
          MASTER_AGENT_BITBUCKET_TOKEN: ${{ secrets.MASTER_AGENT_BITBUCKET_TOKEN }}
          MASTER_AGENT_GITHUB_TOKEN: ${{ secrets.MASTER_AGENT_GITHUB_TOKEN }}
          MASTER_AGENT_GRAPH_ACCESS_TOKEN: ${{ secrets.MASTER_AGENT_GRAPH_ACCESS_TOKEN }}
          MASTER_AGENT_GRAPH_ACCESS_TOKEN_EXPIRES_AT: ${{ secrets.MASTER_AGENT_GRAPH_ACCESS_TOKEN_EXPIRES_AT }}
          MASTER_AGENT_ENTRA_TENANT_ID: ${{ secrets.MASTER_AGENT_ENTRA_TENANT_ID }}
          MASTER_AGENT_ENTRA_APP_CLIENT_ID: ${{ secrets.MASTER_AGENT_ENTRA_APP_CLIENT_ID }}
          MASTER_AGENT_ENTRA_APP_CLIENT_SECRET: ${{ secrets.MASTER_AGENT_ENTRA_APP_CLIENT_SECRET }}
          MASTER_AGENT_LIVE_JIRA_ISSUE_ID: ${{ vars.MASTER_AGENT_LIVE_JIRA_ISSUE_ID }}
          MASTER_AGENT_LIVE_CONFLUENCE_SPACE_ID: ${{ vars.MASTER_AGENT_LIVE_CONFLUENCE_SPACE_ID }}
          MASTER_AGENT_LIVE_CONFLUENCE_PARENT_ID: ${{ vars.MASTER_AGENT_LIVE_CONFLUENCE_PARENT_ID }}
          MASTER_AGENT_LIVE_BITBUCKET_WORKSPACE: ${{ vars.MASTER_AGENT_LIVE_BITBUCKET_WORKSPACE }}
          MASTER_AGENT_LIVE_BITBUCKET_REPOSITORY: ${{ vars.MASTER_AGENT_LIVE_BITBUCKET_REPOSITORY }}
          MASTER_AGENT_LIVE_BITBUCKET_SOURCE_BRANCH: ${{ vars.MASTER_AGENT_LIVE_BITBUCKET_SOURCE_BRANCH }}
          MASTER_AGENT_LIVE_BITBUCKET_DESTINATION_BRANCH: ${{ vars.MASTER_AGENT_LIVE_BITBUCKET_DESTINATION_BRANCH }}
          MASTER_AGENT_LIVE_GITHUB_OWNER: ${{ vars.MASTER_AGENT_LIVE_GITHUB_OWNER }}
          MASTER_AGENT_LIVE_GITHUB_REPOSITORY: ${{ vars.MASTER_AGENT_LIVE_GITHUB_REPOSITORY }}
          MASTER_AGENT_LIVE_MICROSOFT_IDENTITY: ${{ vars.MASTER_AGENT_LIVE_MICROSOFT_IDENTITY }}
          MASTER_AGENT_LIVE_SHAREPOINT_DRIVE_ID: ${{ vars.MASTER_AGENT_LIVE_SHAREPOINT_DRIVE_ID }}
          MASTER_AGENT_LIVE_SHAREPOINT_ITEM_ID: ${{ vars.MASTER_AGENT_LIVE_SHAREPOINT_ITEM_ID }}
          MASTER_AGENT_LIVE_OUTLOOK_RECIPIENT: ${{ vars.MASTER_AGENT_LIVE_OUTLOOK_RECIPIENT }}
          MASTER_AGENT_LIVE_TEAMS_CHAT_ID: ${{ vars.MASTER_AGENT_LIVE_TEAMS_CHAT_ID }}
        run: >-
          python -m unittest
          tests.test_connector_integration_matrix.CredentialedEffectConnectorIntegrationTests
          -v

  github-admin-sandbox:
    name: Protected GitHub administration lifecycle
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_github_admin &&
      vars.MASTER_AGENT_LIVE_GITHUB_ADMIN_TESTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: connector-integration-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Seal hosted Python runtime
        run: |
          test -n "${RUNNER_TOOL_CACHE:-}"
          test -n "${pythonLocation:-}"
          case "$pythonLocation" in
            "$RUNNER_TOOL_CACHE"/*) ;;
            *) exit 1 ;;
          esac
          sudo chmod -R go-w -- "$pythonLocation"
      - name: Install reviewed project
        run: |
          umask 077
          runtime_env="$RUNNER_TEMP/master-agent-live-admin"
          python -m venv "$runtime_env"
          "$runtime_env/bin/python" -m pip install .
          echo "$runtime_env/bin" >> "$GITHUB_PATH"
      - name: Materialize private connector configuration
        env:
          LIVE_INTEGRATIONS_TOML: ${{ secrets.MASTER_AGENT_LIVE_INTEGRATIONS_TOML }}
          ENTERPRISE_CA_BUNDLE_PEM: ${{ secrets.MASTER_AGENT_ENTERPRISE_CA_BUNDLE_PEM }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$LIVE_INTEGRATIONS_TOML"
          integrations="$RUNNER_TEMP/master-agent-live-integrations.toml"
          printf '%s' "$LIVE_INTEGRATIONS_TOML" > "$integrations"
          echo "MASTER_AGENT_LIVE_INTEGRATIONS_FILE=$integrations" >> "$GITHUB_ENV"
          if test -n "$ENTERPRISE_CA_BUNDLE_PEM"; then
            ca_file="$RUNNER_TEMP/master-agent-enterprise-ca.pem"
            printf '%s' "$ENTERPRISE_CA_BUNDLE_PEM" > "$ca_file"
            echo "MASTER_AGENT_ENTERPRISE_CA_BUNDLE=$ca_file" >> "$GITHUB_ENV"
          fi
      - name: Toggle, verify, and restore one sandbox repository setting
        env:
          MASTER_AGENT_RUN_LIVE_GITHUB_ADMIN_TESTS: "1"
          MASTER_AGENT_LIVE_GITHUB_ADMIN_NON_PRODUCTION: ${{ vars.MASTER_AGENT_LIVE_GITHUB_ADMIN_NON_PRODUCTION }}
          MASTER_AGENT_GITHUB_TOKEN: ${{ secrets.MASTER_AGENT_GITHUB_TOKEN }}
          MASTER_AGENT_LIVE_GITHUB_ADMIN_OWNER: ${{ vars.MASTER_AGENT_LIVE_GITHUB_ADMIN_OWNER }}
          MASTER_AGENT_LIVE_GITHUB_ADMIN_REPOSITORY: ${{ vars.MASTER_AGENT_LIVE_GITHUB_ADMIN_REPOSITORY }}
          MASTER_AGENT_LIVE_GITHUB_ADMIN_SETTING: ${{ vars.MASTER_AGENT_LIVE_GITHUB_ADMIN_SETTING }}
        run: >-
          python -m unittest
          tests.test_connector_integration_matrix.CredentialedGitHubAdminConnectorIntegrationTests
          -v
