name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-analysis:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Seal hosted Python runtime
        run: |
          test -n "${RUNNER_TOOL_CACHE:-}"
          test -n "${pythonLocation:-}"
          case "$pythonLocation" in
            "$RUNNER_TOOL_CACHE"/*) ;;
            *) exit 1 ;;
          esac
          sudo chmod -R go-w -- "$pythonLocation"
      - name: Install project and static-analysis tools
        run: |
          umask 077
          runtime_env="$RUNNER_TEMP/master-agent-static"
          python -m venv "$runtime_env"
          "$runtime_env/bin/python" -m pip install ".[dev,drafts]"
          echo "$runtime_env/bin" >> "$GITHUB_PATH"
      - name: Enforce Ruff lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Enforce strict mypy checks
        run: mypy
      - name: Verify dependency lock, licenses, SBOM, and notices
        run: python scripts/generate_sbom.py --check --verify-installed

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install capability-capsule isolation backend
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles bubblewrap
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Seal hosted Python runtime
        run: |
          test -n "${RUNNER_TOOL_CACHE:-}"
          test -n "${pythonLocation:-}"
          case "$pythonLocation" in
            "$RUNNER_TOOL_CACHE"/*) ;;
            *) exit 1 ;;
          esac
          sudo chmod -R go-w -- "$pythonLocation"
      - name: Install project
        run: |
          umask 077
          runtime_env="$RUNNER_TEMP/master-agent-test"
          python -m venv "$runtime_env"
          "$runtime_env/bin/python" -m pip install ".[drafts]"
          echo "$runtime_env/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate behavioral specifications
        run: python scripts/specs.py validate
      - name: Validate release source
        run: python scripts/validate_release.py

  windows-startup:
    name: Windows 11 native filesystem, credentials, process, Git, capsules, and startup
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          architecture: arm64
          cache: pip
      - name: Build and install the wheel at a native long Unicode path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildRuntime = Join-Path $env:RUNNER_TEMP "master-agent-windows-build"
          python -m venv $buildRuntime
          if ($LASTEXITCODE -ne 0) {
            throw "Windows build environment creation failed with exit code $LASTEXITCODE"
          }
          $buildPython = Join-Path $buildRuntime "Scripts\python.exe"
          & $buildPython -m pip install build
          if ($LASTEXITCODE -ne 0) {
            throw "Windows build-tool installation failed with exit code $LASTEXITCODE"
          }
          & $buildPython -m build
          if ($LASTEXITCODE -ne 0) {
            throw "Windows package build failed with exit code $LASTEXITCODE"
          }
          $wheel = @((Get-ChildItem -LiteralPath dist -Filter *.whl).FullName)
          if ($wheel.Count -ne 1) {
            throw "Windows package build did not produce exactly one wheel"
          }
          $runtimeParent = Join-Path $env:RUNNER_TEMP (
            "Master Agent Windows Ω path with spaces\" +
            "nested path segment 001\nested path segment 002\" +
            "nested path segment 003\nested path segment 004\" +
            "nested path segment 005\nested path segment 006"
          )
          New-Item -ItemType Directory -Path $runtimeParent -Force | Out-Null
          $runtime = Join-Path $runtimeParent "wheel runtime"
          if ($runtime.Length -lt 190) {
            throw "Windows wheel test path is not long enough"
          }
          if ($runtime.Length -gt 220) {
            throw "Windows wheel test path leaves insufficient tool-path headroom"
          }
          $longPathPolicy = "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem"
          Set-ItemProperty `
            -LiteralPath $longPathPolicy `
            -Name LongPathsEnabled `
            -Type DWord `
            -Value 1
          if ((Get-ItemPropertyValue `
            -LiteralPath $longPathPolicy `
            -Name LongPathsEnabled) -ne 1) {
            throw "Windows long-path policy is not enabled"
          }
          python -m venv $runtime
          if ($LASTEXITCODE -ne 0) {
            throw "Windows long-path environment creation failed with exit code $LASTEXITCODE"
          }
          $runtimePython = Join-Path $runtime "Scripts\python.exe"
          $runtimeCli = Join-Path $runtime "Scripts\master-agent.exe"
          & $runtimePython -m pip install $wheel[0]
          if ($LASTEXITCODE -ne 0) {
            throw "isolated wheel installation failed with exit code $LASTEXITCODE"
          }
          & $runtimeCli --version
          if ($LASTEXITCODE -ne 0) {
            throw "Windows console launcher failed with exit code $LASTEXITCODE"
          }
          "MASTER_AGENT_WINDOWS_PYTHON=$runtimePython" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MASTER_AGENT_WINDOWS_CLI=$runtimeCli" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run native filesystem and locking tests as a standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $userName = "MasterAgentStandard"
          $account = "$env:COMPUTERNAME\$userName"
          $passwordText = "Ma9!" + [Guid]::NewGuid().ToString("N")
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $credential = [PSCredential]::new($account, $password)
          $testRoot = "C:\MasterAgentStandardTests"
          $crossContextPath = Join-Path $testRoot "cross-context.dpapi"
          $job = $null

          function Invoke-CheckedIcacls {
            param([string[]] $IcaclsArguments)
            & icacls.exe @IcaclsArguments | Out-Host
            if ($LASTEXITCODE -ne 0) {
              throw "icacls failed with exit code $LASTEXITCODE"
            }
          }

          try {
            $user = New-LocalUser `
              -Name $userName `
              -Password $password `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword
            $usersSid = [Security.Principal.SecurityIdentifier]::new(
              "S-1-5-32-545"
            )
            Add-LocalGroupMember -SID $usersSid -Member $user
            if (-not (
              Get-LocalGroupMember -SID $usersSid |
                Where-Object { $_.SID -eq $user.SID }
            )) {
              throw "native Windows test account is not a member of Users"
            }
            if (
              Get-LocalGroupMember -Group "Administrators" |
                Where-Object { $_.SID -eq $user.SID }
            ) {
              throw "native Windows tests must not run with an administrator token"
            }

            New-Item -ItemType Directory -Path $testRoot | Out-Null
            Invoke-CheckedIcacls @($testRoot, "/inheritancelevel:r")
            Invoke-CheckedIcacls @($testRoot, "/setowner", $account)
            Invoke-CheckedIcacls @(
              $testRoot,
              "/remove:g",
              "*S-1-5-11",
              "*S-1-5-32-545"
            )
            Invoke-CheckedIcacls @(
              $testRoot,
              "/grant:r",
              "${account}:(OI)(CI)(F)",
              "*S-1-5-18:(OI)(CI)(F)",
              "*S-1-5-32-544:(OI)(CI)(F)"
            )
            Invoke-CheckedIcacls @($testRoot)
            Invoke-CheckedIcacls @(
              $env:GITHUB_WORKSPACE,
              "/grant",
              "${account}:(OI)(CI)(RX)",
              "/T",
              "/C",
              "/Q"
            )
            $runtimeRoot = Split-Path `
              (Split-Path $env:MASTER_AGENT_WINDOWS_PYTHON -Parent) `
              -Parent
            Invoke-CheckedIcacls @(
              $runtimeRoot,
              "/grant",
              "${account}:(OI)(CI)(RX)",
              "/T",
              "/C",
              "/Q"
            )

            $job = Start-Job `
              -Credential $credential `
              -WorkingDirectory $env:GITHUB_WORKSPACE `
              -ScriptBlock {
                param($Python, $Cli, $Workspace, $TemporaryRoot, $CrossContextPath)
                $ErrorActionPreference = "Stop"
                $env:TEMP = $TemporaryRoot
                $env:TMP = $TemporaryRoot
                $env:PYTHONDONTWRITEBYTECODE = "1"
                $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
                $principal = [Security.Principal.WindowsPrincipal]::new($identity)
                if (
                  $principal.IsInRole(
                    [Security.Principal.WindowsBuiltInRole]::Administrator
                  )
                ) {
                  throw "native Windows tests received an administrator token"
                }
                $sourceRoot = Join-Path $TemporaryRoot (
                  "source checkout Ω with spaces\" +
                  "long segment 001\long segment 002\long segment 003\" +
                  "long segment 004\long segment 005\long segment 006\" +
                  "long segment 007\long segment 008\long segment 009\" +
                  "long segment 010"
                )
                New-Item -ItemType Directory -Path $sourceRoot -Force | Out-Null
                if ($sourceRoot.Length -lt 190) {
                  throw "Windows source bootstrap path is not long enough"
                }
                Get-ChildItem -LiteralPath $Workspace -Force |
                  Where-Object { $_.Name -notin @(".git", ".venv") } |
                  Copy-Item -Destination $sourceRoot -Recurse -Force
                $bootstrap = Join-Path $sourceRoot "scripts\bootstrap_agent.py"
                & $Python $bootstrap
                if ($LASTEXITCODE -ne 0) {
                  throw "standard-user source bootstrap failed with exit code $LASTEXITCODE"
                }
                & $Python $bootstrap
                if ($LASTEXITCODE -ne 0) {
                  throw "standard-user source bootstrap was not idempotent"
                }
                $bootstrapCli = Join-Path $sourceRoot ".venv\Scripts\master-agent.exe"
                & $bootstrapCli --version
                if ($LASTEXITCODE -ne 0) {
                  throw "standard-user source console launcher failed"
                }
                $env:PYTHONPATH = Join-Path $Workspace "src"
                $runner = 'import sys, unittest; loader = unittest.defaultTestLoader; suite = unittest.TestSuite(loader.loadTestsFromName(name) for name in ("tests.test_windows_platform_runtime", "tests.test_windows_credentials", "tests.test_windows_process", "tests.test_windows_git", "tests.test_windows_capsules")); result = unittest.TextTestRunner(stream=sys.stdout, verbosity=2).run(suite); raise SystemExit(0 if result.wasSuccessful() else 1)'
                & $Python -c $runner
                if ($LASTEXITCODE -ne 0) {
                  throw "native Windows filesystem tests failed with exit code $LASTEXITCODE"
                }
                $readinessPath = Join-Path $TemporaryRoot "readiness.json"
                & $Cli readiness --output $readinessPath | Out-Host
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $readinessPath)) {
                  throw "native Windows restricted publication smoke failed"
                }
                $writer = 'import sys; from master_agent.platform_runtime import get_credential_storage_backend; from master_agent.platform_runtime.windows import WINDOWS_DPAPI_PROVIDER; get_credential_storage_backend().store_credentials(provider=WINDOWS_DPAPI_PROVIDER, target=sys.argv[1], credentials={"MASTER_AGENT_CROSS_CONTEXT_SECRET": "cross-context-proof"})'
                & $Python -c $writer $CrossContextPath
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $CrossContextPath)) {
                  throw "standard-user DPAPI cross-context fixture failed"
                }
              } `
              -ArgumentList @(
                $env:MASTER_AGENT_WINDOWS_PYTHON,
                $env:MASTER_AGENT_WINDOWS_CLI,
                $env:GITHUB_WORKSPACE,
                $testRoot,
                $crossContextPath
              )
            $job | Wait-Job -Timeout 900 | Out-Null
            Receive-Job -Job $job
            if ($job.State -ne "Completed") {
              throw "standard-user native Windows test job ended in state $($job.State)"
            }
            if ($job.ChildJobs[0].JobStateInfo.Reason) {
              throw $job.ChildJobs[0].JobStateInfo.Reason
            }
            $reader = 'import sys; from master_agent.errors import ConfigurationError; from master_agent.platform_runtime import get_credential_storage_backend; from master_agent.platform_runtime.windows import WINDOWS_DPAPI_PROVIDER; secret = "cross-context-proof"; backend = get_credential_storage_backend(); code = "def prove():\n try:\n  backend.load_credentials(provider=WINDOWS_DPAPI_PROVIDER, target=sys.argv[1], allowed_names=(\"MASTER_AGENT_CROSS_CONTEXT_SECRET\",))\n except ConfigurationError as error:\n  assert secret not in str(error)\n  return\n raise AssertionError(\"different Windows user decrypted DPAPI state\")"; exec(code); prove()'
            & $env:MASTER_AGENT_WINDOWS_PYTHON -c $reader $crossContextPath
            if ($LASTEXITCODE -ne 0) {
              throw "DPAPI state did not fail closed across Windows user contexts"
            }
          }
          finally {
            if ($null -ne $job) {
              Stop-Job -Job $job -ErrorAction SilentlyContinue
              Remove-Job -Job $job -Force -ErrorAction SilentlyContinue
            }
            Remove-LocalUser -Name $userName -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Prove startup and config-only readiness outside the source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location $env:RUNNER_TEMP
          & $env:MASTER_AGENT_WINDOWS_PYTHON -c "import master_agent; import master_agent.cli; import master_agent.readiness"
          if ($LASTEXITCODE -ne 0) {
            throw "installed-package imports failed with exit code $LASTEXITCODE"
          }
          & $env:MASTER_AGENT_WINDOWS_CLI --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "--help failed with exit code $LASTEXITCODE"
          }
          & $env:MASTER_AGENT_WINDOWS_CLI --version
          if ($LASTEXITCODE -ne 0) {
            throw "--version failed with exit code $LASTEXITCODE"
          }

          $readinessOutput = (& $env:MASTER_AGENT_WINDOWS_CLI readiness | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "config-only readiness failed with exit code $LASTEXITCODE"
          }

          $profilePath = Join-Path $env:RUNNER_TEMP "missing-organization-profile.toml"
          $doctorOutput = (& $env:MASTER_AGENT_WINDOWS_CLI doctor --profile $profilePath --require-level install | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "install-level doctor failed with exit code $LASTEXITCODE"
          }

          foreach ($report in @($readinessOutput, $doctorOutput)) {
            if ($report -notmatch 'platform runtime: windows \(windows-native-partial\)') {
              throw "platform runtime did not report the partial native Windows backend"
            }
            if ($report -notmatch 'secure_filesystem: available \(windows-handle-acl-filesystem\)') {
              throw "platform runtime did not report the native Windows filesystem"
            }
            if ($report -notmatch 'cross_process_locking: available \(windows-lockfileex\)') {
              throw "platform runtime did not report native Windows locking"
            }
            if ($report -notmatch 'atomic_publication_recovery: available \(windows-handle-atomic-state\)') {
              throw "platform runtime did not report native Windows atomic state"
            }
            if ($report -notmatch 'process_supervision: available \(windows-job-object\)') {
              throw "platform runtime did not report native Windows process supervision"
            }
            if ($report -notmatch 'trusted_git: available \(windows-trusted-git\)') {
              throw "platform runtime did not report native Windows trusted Git"
            }
            if ($report -notmatch 'capsule_isolation: available \(windows-appcontainer\)') {
              throw "platform runtime did not report native Windows capsule isolation"
            }
          }

          & $env:MASTER_AGENT_WINDOWS_CLI doctor --profile $profilePath --require-level draft | Out-Null
          $draftExitCode = $LASTEXITCODE
          if ($draftExitCode -ne 2) {
            throw "draft readiness did not fail closed"
          }
          & $env:MASTER_AGENT_WINDOWS_CLI doctor --profile $profilePath --require-level effect | Out-Null
          $effectExitCode = $LASTEXITCODE
          if ($effectExitCode -ne 2) {
            throw "effect readiness did not fail closed"
          }
          exit 0

  package:
    name: Package and isolated artifact tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install capability-capsule isolation backend
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles bubblewrap
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Seal hosted Python runtime
        run: |
          test -n "${RUNNER_TOOL_CACHE:-}"
          test -n "${pythonLocation:-}"
          case "$pythonLocation" in
            "$RUNNER_TOOL_CACHE"/*) ;;
            *) exit 1 ;;
          esac
          sudo chmod -R go-w -- "$pythonLocation"
      - name: Build distributions
        run: |
          umask 077
          build_env="$RUNNER_TEMP/master-agent-build"
          python -m venv "$build_env"
          "$build_env/bin/python" -m pip install build ".[drafts]"
          echo "$build_env/bin" >> "$GITHUB_PATH"
          # Prove package modes do not inherit a permissive builder umask.
          umask 000
          "$build_env/bin/python" -m build
      - name: Validate distribution contents
        run: >-
          python scripts/validate_release.py
          --archive dist/*.whl
          --archive dist/*.tar.gz
      - name: Smoke-test installed wheel outside the source tree
        run: |
          set -euo pipefail
          umask 077
          wheel_env="$RUNNER_TEMP/master-agent-wheel"
          python -m venv "$wheel_env"
          "$wheel_env/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_env/bin/master-agent" readiness \
            --output "$RUNNER_TEMP/readiness.json"
          export HOME="$RUNNER_TEMP/master-agent-wheel-home"
          mkdir -m 0700 "$HOME"
          "$wheel_env/bin/master-agent" setup --non-interactive
          "$wheel_env/bin/master-agent" doctor \
            --require-level install \
            --output "$RUNNER_TEMP/doctor.json"
      - name: Test extracted source distribution
        run: |
          set -euo pipefail
          umask 077
          sdist_dir="$RUNNER_TEMP/master-agent-sdist"
          sdist_env="$RUNNER_TEMP/master-agent-sdist-venv"
          mkdir -p "$sdist_dir"
          tar -xzf dist/*.tar.gz -C "$sdist_dir"
          sdist_root=$(find "$sdist_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)
          python -m venv "$sdist_env"
          "$sdist_env/bin/pip" install "$sdist_root[drafts]"
          cd "$sdist_root"
          "$sdist_env/bin/python" -m unittest discover -s tests -v
          "$sdist_env/bin/python" scripts/specs.py validate
          "$sdist_env/bin/python" scripts/generate_sbom.py --check --verify-installed
          "$sdist_env/bin/python" scripts/validate_release.py

  dependency-security:
    name: Dependency and high-severity source audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Seal hosted Python runtime
        run: |
          test -n "${RUNNER_TOOL_CACHE:-}"
          test -n "${pythonLocation:-}"
          case "$pythonLocation" in
            "$RUNNER_TOOL_CACHE"/*) ;;
            *) exit 1 ;;
          esac
          sudo chmod -R go-w -- "$pythonLocation"
      - name: Install audit tools and project
        run: |
          umask 077
          audit_env="$RUNNER_TEMP/master-agent-audit"
          python -m venv "$audit_env"
          "$audit_env/bin/python" -m pip install --upgrade pip
          "$audit_env/bin/python" -m pip install . bandit pip-audit
          echo "$audit_env/bin" >> "$GITHUB_PATH"
      - name: Reject medium and high severity Bandit findings
        run: bandit -q -r src -ll
      - name: Audit installed dependencies
        run: pip-audit --local

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install capability-capsule isolation backend
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles bubblewrap
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Seal hosted Python runtime
        run: |
          test -n "${RUNNER_TOOL_CACHE:-}"
          test -n "${pythonLocation:-}"
          case "$pythonLocation" in
            "$RUNNER_TOOL_CACHE"/*) ;;
            *) exit 1 ;;
          esac
          sudo chmod -R go-w -- "$pythonLocation"
      - name: Install project and coverage
        run: |
          umask 077
          coverage_env="$RUNNER_TEMP/master-agent-coverage"
          python -m venv "$coverage_env"
          "$coverage_env/bin/python" -m pip install ".[drafts]" coverage
          echo "$coverage_env/bin" >> "$GITHUB_PATH"
      - name: Enforce tested-code baseline
        run: |
          coverage run --source=master_agent -m unittest discover -s tests -v
          coverage report --fail-under=75
