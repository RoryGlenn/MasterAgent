name: Apply issue 75 lint fix

on:
  push:
    branches:
      - agent/issue-75-native-specifications

permissions:
  contents: write

jobs:
  fix:
    name: Apply timezone-aware archive date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/issue-75-native-specifications
          fetch-depth: 0
      - name: Apply exact Ruff correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/specs.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from datetime import date\n"
          old_line = "        updated=date.today().isoformat(),\n"
          if old_import not in text or old_line not in text:
              raise SystemExit("expected issue #75 lint targets were not found")
          text = text.replace(
              old_import,
              "from datetime import UTC, date, datetime\n",
              1,
          )
          text = text.replace(
              old_line,
              "        updated=datetime.now(UTC).date().isoformat(),\n",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          rm -- .github/workflows/issue-75-lint-fix.yml
      - name: Commit the correction and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/specs.py .github/workflows/issue-75-lint-fix.yml
          git commit -m "Use timezone-aware archive date"
          git push origin HEAD:agent/issue-75-native-specifications
