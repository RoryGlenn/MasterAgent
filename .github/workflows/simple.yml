name: MasterAgent Simple

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Simple / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    env:
      PYTHONPATH: simple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run source tests
        run: python -m unittest discover -s simple/tests -v
      - name: Run source demo
        run: python simple/run.py demo
      - name: Install standalone package
        run: python -m pip install --no-deps ./simple
      - name: Run installed command
        env:
          PYTHONPATH: ""
        run: masteragent demo
