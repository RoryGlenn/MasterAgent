name: Temporary live connector test formatter

on:
  push:
    branches:
      - agent/connector-integration-tests

permissions:
  contents: write

jobs:
  apply-exact-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/connector-integration-tests
      - name: Apply the exact Ruff suggestion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_connector_integration_matrix.py")
          text = path.read_text(encoding="utf-8")
          old = ').encode("utf-8")\n'
          new = ').encode()\n'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one explicit UTF-8 encode target")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_connector_integration_matrix.py
          git commit -m "Fix live integration test formatting"
          git push origin HEAD:agent/connector-integration-tests
