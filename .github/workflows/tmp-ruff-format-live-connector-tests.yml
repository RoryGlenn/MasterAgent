name: Temporary Ruff formatter for live connector tests

on:
  push:
    branches:
      - agent/connector-integration-tests

permissions:
  contents: write

jobs:
  format-live-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/connector-integration-tests
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Format the live integration suite with the pinned Ruff version
        run: |
          python -m pip install ruff==0.16.3
          ruff format tests/test_connector_integration_matrix.py
          ruff check tests/test_connector_integration_matrix.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_connector_integration_matrix.py
          git commit -m "Format credentialed connector integration tests"
          git push origin HEAD:agent/connector-integration-tests
