name: One-time live connector dispatcher

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.actor == 'RoryGlenn' &&
      github.head_ref == 'agent/live-connector-run-once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the reviewed default-branch live connector workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: live-connector-integration.yml
          REF: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import os
          import time
          import urllib.request

          repository = os.environ["REPOSITORY"]
          workflow = os.environ["WORKFLOW"]
          ref = os.environ["REF"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repository}/actions/workflows/{workflow}"
          started = dt.datetime.now(dt.UTC)
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "masteragent-live-connector-dispatcher",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          payload = json.dumps(
              {
                  "ref": ref,
                  "inputs": {
                      "run_effects": "true",
                      "run_github_admin": "true",
                  },
              }
          ).encode()
          request = urllib.request.Request(
              f"{api}/dispatches",
              data=payload,
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f"workflow dispatch returned {response.status}")

          runs_url = f"{api}/runs?event=workflow_dispatch&branch={ref}&per_page=10"
          for _ in range(30):
              request = urllib.request.Request(runs_url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = json.load(response)
              for run in body.get("workflow_runs", []):
                  created = dt.datetime.fromisoformat(
                      str(run["created_at"]).replace("Z", "+00:00")
                  )
                  if created >= started - dt.timedelta(seconds=5):
                      print(f"DISPATCHED_RUN_ID={run['id']}")
                      print(f"DISPATCHED_RUN_URL={run['html_url']}")
                      print(f"DISPATCHED_RUN_STATUS={run['status']}")
                      raise SystemExit(0)
              time.sleep(2)
          raise SystemExit("dispatched workflow run was not observable within 60 seconds")
          PY
