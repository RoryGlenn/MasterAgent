[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "masteragent-simple"
version = "0.1.0"
description = "A small, resumable work assistant for Copilot and native Python tools."
requires-python = ">=3.12"
dependencies = []
readme = "README.md"
license = "LicenseRef-MasterAgent-Proprietary"

[project.scripts]
masteragent = "masteragent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["masteragent*"]

[tool.ruff]
target-version = "py312"
