# Generated ownership data is authoritative only for repository navigation.
# Runtime authority remains in policy, specifications, and typed code.

[manifest]
version = 1
generated_document = "docs/semantic-index.md"
allowed_lifecycles = ["released", "implementing", "planned", "archived"]

[[agents]]
id = "master-agent"
kind = "profile"
profile = ".github/agents/MasterAgent.agent.md"
parent = ""
tools = ["read", "search", "edit", "execute"]
max_delegation_depth = 1
fallback = "complete on the selected parent"
sibling_awareness = false
input_contract = "operator goal and minimum authority policy"
output_contract = "validated repository or governed-runtime outcome"
return_path = ""

[[agents]]
id = "read-researcher"
kind = "profile"
profile = ".github/agents/MasterAgent-Read-Researcher.agent.md"
parent = "master-agent"
tools = ["read", "search"]
max_delegation_depth = 0
fallback = "master-agent"
sibling_awareness = false
input_contract = "one sanitized scoped research task"
output_contract = "bounded findings with repository citations"
return_path = "master-agent"

[[agents]]
id = "plan-reviewer"
kind = "profile"
profile = ".github/agents/MasterAgent-Plan-Reviewer.agent.md"
parent = "master-agent"
tools = ["read", "search"]
max_delegation_depth = 0
fallback = "master-agent"
sibling_awareness = false
input_contract = "one sanitized plan-review task"
output_contract = "blocking and non-blocking findings with citations"
return_path = "master-agent"

[[agents]]
id = "docs-contract"
kind = "contract"
profile = ".ai/DOCS_AGENT.md"
parent = "master-agent"
tools = ["read", "search", "edit-documentation"]
max_delegation_depth = 0
fallback = "master-agent"
sibling_awareness = false
input_contract = "final change and verification evidence"
output_contract = "updated, no_change, or needs_review"
return_path = "master-agent"

[[agents]]
id = "deterministic-runtime"
kind = "runtime"
profile = "src/master_agent/orchestrator.py"
parent = "master-agent"
tools = ["typed-capabilities"]
max_delegation_depth = 0
fallback = "master-agent"
sibling_awareness = false
input_contract = "validated exact ChangePlan and execution context"
output_contract = "verified RunReport and content-free evidence"
return_path = "master-agent"

[[routes]]
id = "semantic-router"
title = "Semantic router and exact ownership"
lifecycle = "released"
summary = "Validate exhaustive ownership, route one task, generate the compact index, and measure routing."
authority = ["specs/current/development/MA-ROUTER-001.md", "AGENTS.md"]
implementation = ["scripts/semantic_router.py"]
configuration = [".ai/semantic-router.toml"]
tests = ["tests/test_semantic_router.py"]
release_gates = ["scripts/validate_release.py", ".github/workflows/ci.yml"]
dependencies = ["packaging-release"]
aliases = ["semantic router", "ownership manifest", "agent topology manifest", "routing accuracy", "semantic index generation", "review commit", "review revision"]
agent = "master-agent"

