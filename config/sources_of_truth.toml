# Exact-resource rules for the scaffold. Production should support organization-owned
# registries and carefully reviewed patterns.

[[rules]]
field = "project_status_narrative"
canonical_system = "confluence"
canonical_resource_id = "project-status"
projections = ["powerpoint:weekly-status", "teams:weekly-status-draft", "outlook:weekly-status-draft"]
direction = "outbound_only"
canonical_extractors = { "confluence.page.update" = ["body"] }
projection_extractors = { "teams.message.draft" = ["body"], "outlook.email.draft" = ["body"] }

# The exact powerpoint:weekly-status target intentionally remains governed but
# has no allowed projection capability. Generic slide content cannot identify
# which rendered text belongs to which canonical field, so it fails closed until
# the connector accepts a typed, field-addressed projection schema.
