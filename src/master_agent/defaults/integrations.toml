# Master Agent v1 live integrations. Read connectors are available by default
# and resolve credentials only when selected. Writes, administration, and sends
# remain independently gated. No credential values belong in this file. Every
# *_env field names an environment variable injected at runtime.

[network_profiles.direct]
mode = "direct"

[connectors.jira]
network_profile = "direct"
enabled = true
deployment = "cloud" # cloud | data_center
base_url = "https://example.atlassian.net"
# Browser references are kept separate from a scoped-token API gateway root.
web_base_url = "https://example.atlassian.net"
auth_mode = "basic" # basic | bearer | none
username_env = "MASTER_AGENT_JIRA_USERNAME"
secret_env = "MASTER_AGENT_JIRA_TOKEN"
ca_bundle_env = "MASTER_AGENT_ENTERPRISE_CA_BUNDLE"
timeout_seconds = 20
max_pages = 10
max_items = 200
max_response_bytes = 10485760
writes_enabled = false
# Legacy compatibility alias. Keep false unless writes_enabled is reviewed.
write_enabled = false

[connectors.confluence]
network_profile = "direct"
enabled = true
deployment = "cloud" # cloud | data_center
base_url = "https://example.atlassian.net"
web_base_url = "https://example.atlassian.net"
auth_mode = "basic"
username_env = "MASTER_AGENT_CONFLUENCE_USERNAME"
secret_env = "MASTER_AGENT_CONFLUENCE_TOKEN"
ca_bundle_env = "MASTER_AGENT_ENTERPRISE_CA_BUNDLE"
timeout_seconds = 20
max_pages = 10
max_items = 100
max_response_bytes = 10485760
writes_enabled = false
# Legacy compatibility alias. Keep false unless writes_enabled is reviewed.
write_enabled = false

[connectors.bitbucket]
network_profile = "direct"
enabled = true
deployment = "cloud" # cloud | data_center
# Cloud API root. For Data Center, use the server/context root.
base_url = "https://api.bitbucket.org/2.0"
auth_mode = "basic"
# Atlassian API tokens use the account email; legacy app-password deployments
# may select a different username_env in their private configuration.
username_env = "MASTER_AGENT_BITBUCKET_EMAIL"
secret_env = "MASTER_AGENT_BITBUCKET_TOKEN"
ca_bundle_env = "MASTER_AGENT_ENTERPRISE_CA_BUNDLE"
timeout_seconds = 20
max_pages = 10
max_items = 100
max_response_bytes = 10485760
pull_request_writes_enabled = false
branch_push_enabled = false
repository_root_env = "MASTER_AGENT_REPOSITORY_ROOT"
branch_prefix = "agent/"
# Legacy compatibility alias. Keep false unless a granular flag is reviewed.
write_enabled = false

[connectors.github]
network_profile = "direct"
enabled = true
deployment = "cloud"
base_url = "https://api.github.com"
auth_mode = "bearer"
# Bind and apply verify this token through GET /user and approval-bind its
# provider-returned numeric user ID. No claimed principal belongs in this file.
secret_env = "MASTER_AGENT_GITHUB_TOKEN"
ca_bundle_env = "MASTER_AGENT_ENTERPRISE_CA_BUNDLE"
timeout_seconds = 20
max_pages = 10
max_items = 100
max_response_bytes = 10485760
writes_enabled = false
admin_enabled = false
# Legacy compatibility alias. Keep false unless a granular flag is reviewed.
write_enabled = false

[connectors.microsoft]
network_profile = "direct"
enabled = true
deployment = "cloud"
# Change this root for a supported Microsoft national cloud.
base_url = "https://graph.microsoft.com/v1.0"
auth_mode = "oauth_delegated" # oauth_delegated | oauth_application | bearer
# Recommended local delegated mode: run `master-agent oauth-device-code`, then
# point this environment variable at the resulting mode-0600 token file.
# Delegated execution is provider-attested through Graph `/me`. Use
# client_credentials only for capabilities that explicitly permit application
# identity; the tenant/client pair is bound automatically.
oauth_flow = "token_file" # token_file | environment | client_credentials
token_file_env = "MASTER_AGENT_GRAPH_TOKEN_FILE"
secret_env = "MASTER_AGENT_GRAPH_ACCESS_TOKEN"
token_expires_at_env = "MASTER_AGENT_GRAPH_ACCESS_TOKEN_EXPIRES_AT"
tenant_id_env = "MASTER_AGENT_ENTRA_TENANT_ID"
client_id_env = "MASTER_AGENT_ENTRA_APP_CLIENT_ID"
client_secret_env = "MASTER_AGENT_ENTRA_APP_CLIENT_SECRET"
scopes = ["User.Read", "Mail.Read", "Chat.Read", "Sites.Read.All", "Notes.Read"]
ca_bundle_env = "MASTER_AGENT_ENTERPRISE_CA_BUNDLE"
timeout_seconds = 20
max_pages = 16
max_items = 200
max_response_bytes = 10485760
sharepoint_writes_enabled = false
onenote_read_enabled = true
outlook_send_enabled = false
teams_send_enabled = false
# Legacy compatibility aliases. Keep false unless granular flags are reviewed.
write_enabled = false
send_enabled = false
max_upload_bytes = 1000000
identity_mode = "delegated" # delegated | application
default_identity = "me" # Use an object ID/UPN for application identity mode.
allowed_text_extensions = [".txt", ".md", ".json", ".csv", ".yaml", ".yml", ".log"]
max_text_file_bytes = 1000000
download_host_suffixes = [".sharepoint.com", ".1drv.com"]
allowed_mail_attachment_extensions = [".txt", ".md", ".json", ".csv", ".yaml", ".yml", ".log"]
allowed_mail_attachment_mime_types = ["text/plain", "text/markdown", "text/csv", "application/json", "application/yaml", "application/x-yaml", "text/yaml"]
max_mail_attachment_bytes = 250000
teams_probe = "chats" # chats | teams
